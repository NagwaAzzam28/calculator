<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="calc">
        <div class="output">
          <div class="prev-output">20</div>
          <div class="current-output">10</div>
        </div>
        <div class="buttons">
          <button class="clear-btn" data-action="clear">AC</button>
          <button class="delete-btn" data-action="delete">DEL</button>
          <button class="op-btn" data-operator="/">/</button>
          <button class="num-btn" data-value="9">9</button>
          <button class="num-btn" data-value="8">8</button>
          <button class="num-btn" data-value="7">7</button>
          <button class="op-btn" data-operator="*">×</button>
          <button class="num-btn" data-value="4">4</button>
          <button class="num-btn" data-value="5">5</button>
          <button class="num-btn" data-value="6">6</button>
          <button class="op-btn" data-operator="-">−</button>
          <button class="num-btn" data-value="1">1</button>
          <button class="num-btn" data-value="2">2</button>
          <button class="num-btn" data-value="3">3</button>
          <button class="op-btn" data-operator="+">+</button>
          <button class="num-btn" data-value="0">0</button>
          <button class="decimal" data-value=".">.</button>
          <button class="equal-btn" data-action="equals">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
